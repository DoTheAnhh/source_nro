#SERVER
server.local=false
server.test=false
server.daoautoupdater=false
server.sv=1
server.name=DoTheAnh
# "auto" = tu do IP LAN cua may dang chay (dung khi IP doi theo DHCP hoac
# khi chep ca thu muc sang may khac). Go thang mot dia chi de ep cung.
server.ip=auto
server.port=14445
# Duong dan file ma CLIENT doc dia chi may chu. Server tu ghi dia chi no do
# duoc vao day moi lan khoi dong, nen doi mang chi con hai viec: bat server,
# roi build lai mod.
#
# Bo trong = khong ghi gi (dung khi chay tren VPS, khong co thu muc mod canh do).
server.ipfile=F:/NgocRong/Mod/Assets/Resources/server_ip.txt
# Ban doc LUC CHAY, dat canh file .exe cua client. Sua file nay la client tro
# dia chi khac ngay, khong phai build lai trong Unity. De trong = khong ghi.
# Server ghi 127.0.0.1 vao day (khong phai IP LAN): file nay nam canh ban chay
# cua client nen client do o cung may voi server, ma loopback thi khong bao gio
# hong khi doi wifi. Client o may KHAC thi tu tay sua file server_ip.txt canh
# .exe cua no thanh IP LAN cua may chay server.
server.ipfile.chay=F:/NgocRong/Game/PC/server_ip.txt
# Ban cho UNITY EDITOR. Trong Editor, Application.dataPath tro toi Mod/Assets
# nen client tim file o Mod/server_ip.txt. File nay mang IP LAN THAT (khong
# phai 127.0.0.1) de ban chay trong Editor noi dung dia chi may chu dang quang
# ba. No nam NGOAI thu muc Assets nen Unity khong nap lai du an moi lan ghi de.
server.ipfile.editor=F:/NgocRong/Mod/server_ip.txt
# Chi hien THI MOT may chu. Muc nay tung tao ra may chu thu hai
# trong danh sach (server.ip da sinh ra muc thu nhat roi).
#server.sv1=NroAnwin9:192.168.198.158:14445:0,0,0
server.waitlogin=10
server.maxperip=99999
server.maxplayer=9999
server.expserver=5


#DATABASE
database.driver=com.mysql.jdbc.Driver
database.host=localhost
database.port=3306
database.name=awnv3
database.user=root
database.pass=
database.min=1
database.max=1
database.lifetime=120000