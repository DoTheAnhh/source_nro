#SERVER
server.local=false
server.test=false
server.daoautoupdater=false
server.sv=1
server.name=DoTheAnh
# "auto" = tu do IP LAN cua may dang chay (dung khi IP doi theo DHCP hoac
# khi chep ca thu muc sang may khac). Go thang mot dia chi de ep cung.
server.ip=auto
server.port=14445
# Duong dan file ma CLIENT doc dia chi may chu. Server tu ghi dia chi no do
# duoc vao day moi lan khoi dong. Bo trong = khong ghi gi.
#
# DA BO TRONG CA BA KHOA — CO Y, dung dien lai neu chua doc doan duoi.
#
# Ba khoa nay sinh ra cho canh "server va client o cung mot may": server do
# IP LAN roi ghi ho client, doi wifi xong khong phai sua tay. Gio may chu
# chay tren VPS 160.22.107.46:14445, nen viec ghi tu dong tro thanh pha:
# moi lan bat server local la ba file server_ip.txt bi ghi de bang IP LAN
# cua may nay, va client dang tro ve VPS bi keo ve mot dia chi noi bo.
#
# Client lay dia chi o dau:
#   1. Mod/server_ip.txt              — ban chay trong Unity Editor
#   2. Mod/Assets/Resources/server_ip.txt — nuong vao ban build (APK, iOS)
#   3. So mac dinh trong ServerListScreen.diaChiMayChu()
# Ca ba cho da tro ve 160.22.107.46.
#
# Muon quay lai chay thu voi server local: sua Mod/server_ip.txt thanh
# 127.0.0.1 (nguon 1 thang nguon 3), dung dien lai ba khoa nay.
server.ipfile=
server.ipfile.chay=
server.ipfile.editor=
# Chi hien THI MOT may chu. Muc nay tung tao ra may chu thu hai
# trong danh sach (server.ip da sinh ra muc thu nhat roi).
#server.sv1=NroAnwin9:192.168.198.158:14445:0,0,0
server.waitlogin=10
server.maxperip=99999
server.maxplayer=9999
server.expserver=5


#DATABASE
database.driver=com.mysql.jdbc.Driver
database.host=localhost
database.port=3306
database.name=awnv3
database.user=root
database.pass=
database.min=1
database.max=1
database.lifetime=120000